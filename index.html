<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Meghna 💖</title>

<style>
body {
    margin: 0;
    text-align: center;
    font-family: Arial;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    color: white;
}

/* Hide all sections initially */
.section {
    display: none;
    margin-top: 100px;
}

img {
    width: 200px;
    cursor: pointer;
}

/* Button */
button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    background: white;
    color: #ff4b2b;
    cursor: pointer;
    margin-top: 20px;
}

/* Slideshow */
.slideshow img {
    width: 250px;
    border-radius: 15px;
}
</style>

</head>

<body>

<!-- 🎁 Gift Box -->
<div id="gift" class="section" style="display:block;">
    <h1>🎁 Tap to open your gift</h1>
    <img src="https://cdn-icons-png.flaticon.com/512/869/869636.png" onclick="openGift()">
</div>

<!-- ✉️ Envelope -->
<div id="envelope" class="section">
    <h1>💌 Tap to open</h1>
    <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" onclick="openLetter()">
</div>

<!-- 💖 Letter -->
<div id="letter" class="section">
    <h2>💖 Dear Meghna,</h2>
    <p>
        Happy Birthday! 🥳 <br><br>
        You are truly someone special in my life ✨ <br>
        May your days be filled with happiness, laughter, and success 💫 <br><br>
        Keep smiling always 😊💖
    </p>
    <button onclick="goToQuestion()">Continue ➡️</button>
</div>

<!-- ❓ Question -->
<div id="question" class="section">
    <h2>By what name do I call you most often? 😏</h2>
    <input type="text" id="answer" placeholder="Type your answer">
    <br>
    <button onclick="checkAnswer()">Submit</button>
    <p id="result"></p>
</div>

<!-- 📸 Slideshow -->
<div id="slideshow" class="section">
    <h2>💖 Our Memories 💖</h2>
    <div class="slideshow">
        <img id="slide" src="photo1.jpg">
    </div>
</div>

<script>
function openGift() {
    document.getElementById("gift").style.display = "none";
    document.getElementById("envelope").style.display = "block";
}

function openLetter() {
    document.getElementById("envelope").style.display = "none";
    document.getElementById("letter").style.display = "block";
}

function goToQuestion() {
    document.getElementById("letter").style.display = "none";
    document.getElementById("question").style.display = "block";
}

function checkAnswer() {
    let ans = document.getElementById("answer").value.toLowerCase();
    
    if (ans === "rowdy") {
        document.getElementById("question").style.display = "none";
        document.getElementById("slideshow").style.display = "block";
        startSlideshow();
    } else {
        document.getElementById("result").innerHTML = "❌ Try again 😜";
    }
}

/* Slideshow */
let images = ["photo1.jpg", "photo2.jpg", "photo3.jpg"];
let i = 0;

function startSlideshow() {
    setInterval(() => {
        i = (i + 1) % images.length;
        document.getElementById("slide").src = images[i];
    }, 2000);
}
</script>

</body>
</html>
