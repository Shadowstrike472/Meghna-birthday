<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Meghna ?</title>

<style>
body {
    margin: 0;
    padding: 0;
    text-align: center;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    color: white;
    overflow: hidden;
}

.container {
    margin-top: 80px;
}

h1 {
    font-size: 3em;
}

h2 {
    font-size: 2em;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    background: white;
    color: #ff4b2b;
    border-radius: 25px;
    cursor: pointer;
}

#message {
    margin-top: 30px;
    font-size: 22px;
    display: none;
    line-height: 1.5;
}

img {
    margin-top: 20px;
    width: 220px;
    border-radius: 15px;
    display: none;
}

/* Confetti */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: white;
    top: 0;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>? Happy Birthday ?</h1>
    <h2>Meghna ?</h2>

    <button onclick="showSurprise()">Click for Surprise ?</button>

    <p id="message">
        ? Happy Birthday Meghna! ? <br><br>
        You are truly someone special ? <br>
        May your life be filled with happiness, success, and beautiful moments ? <br><br>
        Keep smiling always ?
    </p>

    <img id="photo" src="https://i.imgur.com/4M7IWwP.png">
</div>

<audio id="music" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

<script>
function showSurprise() {
    document.getElementById("message").style.display = "block";
    document.getElementById("photo").style.display = "block";
    document.getElementById("music").play();
    startConfetti();
}

function startConfetti() {
    for (let i = 0; i < 50; i++) {
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(confetti);
    }
}
</script>

</body>
</html>
