<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Meghna 💖</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0f0c29;
    color: white;
    text-align: center;
    overflow: hidden;
}

/* Smooth sections */
.section {
    position: absolute;
    width: 100%;
    top: 20%;
    opacity: 0;
    transform: scale(0.9);
    transition: 0.5s ease;
}
.active {
    opacity: 1;
    transform: scale(1);
}

/* Gift */
.gift {
    font-size: 80px;
    cursor: pointer;
    transition: 0.3s;
}
.gift:hover {
    transform: scale(1.2) rotate(10deg);
}

/* Envelope */
.envelope {
    font-size: 80px;
    cursor: pointer;
    transition: 0.3s;
}
.envelope:hover {
    transform: scale(1.2);
}

/* Letter */
#letterText {
    width: 80%;
    margin: auto;
    font-size: 18px;
    line-height: 1.5;
}

/* Button */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: white;
    color: #ff4b2b;
    font-size: 16px;
}

/* Slideshow */
#slide {
    width: 85%;
    max-width: 300px;
    border-radius: 15px;
}

/* Hearts */
.heart {
    position: fixed;
    animation: float 4s linear infinite;
}
@keyframes float {
    to { transform: translateY(-100vh); }
}
</style>

</head>

<body>

<!-- 🎁 Gift -->
<div id="gift" class="section active">
    <h2>Tap your gift 🎁</h2>
    <div class="gift" onclick="next('gift','envelope')">🎁</div>
</div>

<!-- 💌 Envelope -->
<div id="envelope" class="section">
    <h2>Open the letter 💌</h2>
    <div class="envelope" onclick="openLetter()">💌</div>
</div>

<!-- 💖 Letter -->
<div id="letter" class="section">
    <h2>Dear Meghna 💖</h2>
    <p id="letterText"></p>
    <button onclick="next('letter','question')">Continue ➡️</button>
</div>

<!-- ❓ Question -->
<div id="question" class="section">
    <h3>What name do I call you most often? 😏</h3>
    <input id="answer">
    <br><br>
    <button onclick="check()">Submit</button>
    <p id="result"></p>
</div>

<!-- 📸 Slideshow -->
<div id="slideshow" class="section">
    <h2>Our Memories 💖</h2>
    <img id="slide" src="photo1.jpg">
</div>

<audio id="music" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

<script>

/* Smooth transition */
function next(current, next) {
    document.getElementById(current).classList.remove("active");
    setTimeout(() => {
        document.getElementById(next).classList.add("active");
    }, 300);
}

/* Letter typing */
const text = "Happy Birthday Meghna 💖 You are truly special... Stay happy always 😊✨";
let i = 0;

function openLetter() {
    next('envelope','letter');
    document.getElementById("music").play();
    type();
}

function type() {
    if (i < text.length) {
        document.getElementById("letterText").innerHTML += text[i];
        i++;
        setTimeout(type, 40);
    }
}

/* Question */
function check() {
    let ans = document.getElementById("answer").value.toLowerCase();
    if (ans === "rowdy") {
        next('question','slideshow');
        startSlide();
        hearts();
    } else {
        document.getElementById("result").innerHTML = "Try again 😜";
    }
}

/* Slideshow */
let imgs = ["photo1.jpg","photo2.jpg","photo3.jpg"];
let index = 0;

function startSlide() {
    setInterval(()=>{
        index = (index+1)%imgs.length;
        document.getElementById("slide").src = imgs[index];
    },2000);
}

/* Hearts */
function hearts() {
    for(let i=0;i<30;i++){
        let h=document.createElement("div");
        h.innerHTML="💖";
        h.className="heart";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(20+Math.random()*20)+"px";
        document.body.appendChild(h);
    }
}

</script>

</body>
</html>
